name: Constantia Android release build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CONSTANTIA_KEYSTORE_BASE64: ${{ secrets.CONSTANTIA_KEYSTORE_BASE64 }}
      CONSTANTIA_KEYSTORE_PASSWORD: ${{ secrets.CONSTANTIA_KEYSTORE_PASSWORD }}
      CONSTANTIA_KEY_ALIAS: ${{ secrets.CONSTANTIA_KEY_ALIAS }}
      CONSTANTIA_EXPECTED_CERT_SHA256: "cd4f45ccfd54aae6f950dc586a0190f2668694698b559f9ea36ede174ba60549"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require stable signing secrets
        shell: bash
        run: |
          test -n "$CONSTANTIA_KEYSTORE_BASE64" || { echo "Missing CONSTANTIA_KEYSTORE_BASE64"; exit 1; }
          test -n "$CONSTANTIA_KEYSTORE_PASSWORD" || { echo "Missing CONSTANTIA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$CONSTANTIA_KEY_ALIAS" || { echo "Missing CONSTANTIA_KEY_ALIAS"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/constantia-signing.jks"
          printf '%s' "$CONSTANTIA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "CONSTANTIA_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 17 SDK
        shell: bash
        run: |
          sdkmanager --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Restore wrapper metadata for preflight
        shell: bash
        run: |
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          distributionSha256Sum=bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Static preflight
        run: python3 tools/preflight.py

      - name: Engine tests
        run: bash tools/run_engine_tests.sh

      - name: Build stable release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK signature and signing certificate
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          ACTUAL=$(awk -F': ' '/certificate SHA-256 digest:/ {print tolower($NF); exit}' "$RUNNER_TEMP/apksigner.txt")
          test -n "$ACTUAL" || { echo "Could not read signer certificate SHA-256"; exit 1; }
          test "$ACTUAL" = "$CONSTANTIA_EXPECTED_CERT_SHA256" || { echo "Unexpected signing certificate: $ACTUAL"; exit 1; }

      - name: Verify APK and generate checksum
        run: python3 tools/verify_apk.py app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: constantia-1.0.0-rc3.2-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
